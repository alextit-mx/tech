<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Tech Computer">
  <defs>
    <radialGradient id="glow" cx="50%" cy="44%" r="60%">
      <stop offset="0" stop-color="#E30613" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#E30613" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#E30613" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16141a"/>
      <stop offset="1" stop-color="#0a090c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a55"/>
      <stop offset="1" stop-color="#7A0710"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#grid)"/>
  <rect width="800" height="800" fill="url(#glow)"/>
  <!-- Hexágono como el marco del emblema ATS, con un chip al centro. -->
  <g transform="translate(400 350)">
    <path d="M0-170 147-85V85L0 170-147 85V-85Z" fill="none" stroke="url(#edge)" stroke-width="6" stroke-linejoin="round" opacity="0.9"/>
    <path d="M0-140 121-70V70L0 140-121 70V-70Z" fill="#0d0c10" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
    <rect x="-52" y="-52" width="104" height="104" rx="10" fill="none" stroke="#E30613" stroke-width="5"/>
    <rect x="-26" y="-26" width="52" height="52" rx="4" fill="#E30613" opacity="0.85"/>
    <g stroke="#E30613" stroke-width="5" stroke-linecap="round" opacity="0.75">
      <path d="M-30-52v-22M0-52v-22M30-52v-22M-30 52v22M0 52v22M30 52v22M-52-30h-22M-52 0h-22M-52 30h-22M52-30h22M52 0h22M52 30h22"/>
    </g>
  </g>
  <text x="400" y="612" text-anchor="middle" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="9" fill="#f5f5f3" fill-opacity="0.85">TECH COMPUTER</text>
  <text x="400" y="654" text-anchor="middle" font-family="'Barlow','Segoe UI',Arial,sans-serif" font-size="20" letter-spacing="4" fill="#a9b0ba" fill-opacity="0.7">FOTO PRÓXIMAMENTE</text>
